<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – Hareesh IT Industry</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Hareesh IT Industry</h1>
  <p>Admin Panel – Cricket and Kabaddi Registrations</p>
</header>

<main id="loginView">
  <div class="card">
    <form id="loginForm">
      <label for="key">Admin Key</label>
      <input id="key" type="password" required autocomplete="current-password" placeholder="Enter admin key">
      <button type="submit">Login</button>
      <div id="err" class="msg"></div>
    </form>
  </div>
</main>

<main id="dataView" class="wide hidden">
  <div class="card">
    <div class="top">
      <div>
        <span class="stat">Verified teams: <b id="total">0</b></span>
        <span class="stat">Awaiting verification: <b id="pending">0</b></span>
        <span class="stat">Collected: <b id="collected">0</b></span>
      </div>
      <div class="keybox">
        <select id="filter">
          <option value="all">All sports</option>
          <option value="cricket">Cricket</option>
          <option value="kabaddi">Kabaddi</option>
        </select>
        <button id="logout" class="link" type="button">Logout</button>
      </div>
    </div>
    <div class="hint">Check each Transaction ID in your payment app (ID and amount must match), then click Verify.</div>
    <div class="scroll">
      <table>
        <thead><tr><th>#</th><th>Sport</th><th>Captain</th><th>Contact</th><th>Email</th><th>College</th><th>Year</th><th>Transaction ID</th><th>Fee</th><th>Payment</th><th>Date</th><th>Action</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const money = n => '\u20B9' + Number(n).toLocaleString('en-IN');
const label = s => s.charAt(0).toUpperCase() + s.slice(1);
let currentKey = '';
let all = [];

async function api(path, method) {
  return fetch(path, { method: method || 'GET', headers: { 'x-admin-key': currentKey } });
}

function render() {
  const f = $('filter').value;
  const list = f === 'all' ? all : all.filter(t => t.sport === f);
  const paid = list.filter(t => t.status === 'paid');
  $('total').textContent = paid.length;
  $('pending').textContent = list.length - paid.length;
  $('collected').textContent = money(paid.reduce((n, t) => n + t.amount, 0));

  const tbody = $('rows');
  tbody.innerHTML = '';
  list.forEach((t, i) => {
    const tr = document.createElement('tr');
    [i + 1, label(t.sport), t.captain, t.contact, t.email, t.college, t.year,
     t.utr || '-', money(t.amount), t.status === 'paid' ? 'Verified' : 'Awaiting',
     new Date(t.registeredAt).toLocaleString()
    ].forEach((v, idx) => {
      const td = document.createElement('td'); td.textContent = v;
      if (idx === 9) td.className = t.status === 'paid' ? 'paid' : 'pend';
      tr.appendChild(td);
    });
    const act = document.createElement('td');
    const box = document.createElement('div'); box.className = 'noshrink';
    if (t.status !== 'paid') {
      const ok = document.createElement('button');
      ok.type = 'button'; ok.className = 'verify'; ok.textContent = 'Verify';
      ok.addEventListener('click', () => verifyTeam(t));
      box.appendChild(ok);
    }
    const del = document.createElement('button');
    del.type = 'button'; del.className = 'del'; del.textContent = 'Delete';
    del.addEventListener('click', () => removeTeam(t));
    box.appendChild(del);
    act.appendChild(box); tr.appendChild(act);
    tbody.appendChild(tr);
  });
}

async function load(key) {
  currentKey = key;
  const res = await api('/api/teams');
  if (!res.ok) throw new Error('Invalid admin key.');
  all = (await res.json()).teams;
  render();
  $('loginView').classList.add('hidden');
  $('dataView').classList.remove('hidden');
}

async function verifyTeam(t) {
  if (!confirm('Mark payment from ' + t.captain + ' (' + label(t.sport) + ', ID ' + t.utr + ', ' + money(t.amount) + ') as verified?')) return;
  const res = await api('/api/teams/' + t.id + '/verify', 'PATCH');
  if (!res.ok) { alert('Could not verify. Please try again.'); return; }
  load(currentKey);
}

async function removeTeam(t) {
  if (!confirm('Delete the ' + label(t.sport) + ' registration of ' + t.captain + '? This cannot be undone.')) return;
  const res = await api('/api/teams/' + t.id, 'DELETE');
  if (!res.ok) { alert('Could not delete. Please try again.'); return; }
  load(currentKey);
}

$('filter').addEventListener('change', render);

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('err').textContent = '';
  try {
    await load($('key').value);
    sessionStorage.setItem('adminKey', $('key').value);
  } catch (err) { $('err').textContent = err.message; }
});

$('logout').addEventListener('click', () => {
  sessionStorage.removeItem('adminKey');
  location.reload();
});

const saved = sessionStorage.getItem('adminKey');
if (saved) load(saved).catch(() => sessionStorage.removeItem('adminKey'));
</script>
</body>
</html>
